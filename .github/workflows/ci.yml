name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - 'docs/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # Build and Test
  # ===========================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and Test
        run: ./mvnw verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-artifacts
          path: target/
          retention-days: 1

  # ===========================================
  # Native build + JVM/native parity
  # ===========================================
  # The native executable is a different program from the JVM build: it only knows the
  # classes registered for reflection, and the tool catalogue is generated by reflection.
  # A record the image cannot see does not fail the build -- it publishes an empty
  # outputSchema and moves on. So the native binary is compiled on every change, asked for
  # its catalogue, and compared byte for byte with the JVM's before anyone ships it.
  native:
    name: Build and Test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mandrel is the GraalVM distribution Quarkus is tested against; the 25 line matches
      # the default builder image the container-build path would pull.
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          distribution: 'mandrel'
          java-version: '25'
          cache: 'maven'

      # One build yields both target/*-runner and target/quarkus-app/ (the native profile
      # does not disable the JVM package), so the parity check compares the same commit
      # without a second compilation. The heap cap keeps native-image inside a 7 GB runner.
      - name: Build native executable
        run: ./mvnw package -Pnative -DskipTests -B -Dquarkus.native.native-image-xmx=5g

      - name: Compare tools/list between JVM and native
        run: scripts/mcp-native-parity.sh

      - name: Build native container images
        run: |
          docker build -f src/main/docker/Dockerfile.native -t cncf-tech-advisor-mcp:native-ci .
          docker build -f src/main/docker/Dockerfile.native-micro -t cncf-tech-advisor-mcp:native-micro-ci .

      # Both images must start and answer the protocol, not merely build. server/discover is
      # the readiness signal: the port accepting a connection is not, since Quarkus binds
      # before the MCP routes exist.
      - name: Smoke test native images
        run: |
          set -euo pipefail
          for image in cncf-tech-advisor-mcp:native-ci cncf-tech-advisor-mcp:native-micro-ci; do
            CID=$(docker run -d -p 127.0.0.1:8080:8080 "$image")
            ok=""
            for _ in $(seq 1 60); do
              if curl -sf -X POST http://127.0.0.1:8080/mcp \
                   -H 'Content-Type: application/json' \
                   -H 'Accept: application/json, text/event-stream' \
                   -H 'Mcp-Method: server/discover' \
                   -H 'MCP-Protocol-Version: 2026-07-28' \
                   -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"smoke","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
                   | grep -q '"supportedVersions"'; then
                ok=yes; break
              fi
              sleep 0.5
            done
            if [[ -z "$ok" ]]; then
              echo "::error::$image did not answer server/discover"
              docker logs "$CID"
              exit 1
            fi
            echo "$image answered server/discover"
            docker rm -f "$CID" > /dev/null
          done

  # ===========================================
  # Docker Image (solo en push a main)
  # ===========================================
  docker:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max