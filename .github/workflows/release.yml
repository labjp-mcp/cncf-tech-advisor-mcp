name: Release

# A tag v* publishes three things: a GitHub Release (uber-jar + native executables for
# Linux x64 and macOS arm64), and the JVM container image ghcr.io/labjp-mcp/cncf-tech-advisor-mcp.
# Nothing is published to npm: the npm wrapper distribution is legacy (see CLAUDE.md).

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # ===========================================
  # Build and Test
  # ===========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw verify

  # ===========================================
  # Build Native Binaries
  # ===========================================
  # Only runners whose architecture matches the asset name: macos-14 is arm64, ubuntu-latest
  # is x64. (The former "macos-x64" entry ran on macos-15, which is arm64 too, so it shipped
  # an arm64 binary under an x64 name.)
  build-native:
    name: Build Native (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: cncf-tech-advisor-mcp-macos-arm64
          - os: ubuntu-latest
            artifact: cncf-tech-advisor-mcp-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build native image
        run: ./mvnw package -Pnative -DskipTests

      # Same gate as build.yml: the native catalogue and two tool calls must match the JVM's.
      - name: Compare JVM and native
        if: runner.os == 'Linux'
        run: scripts/mcp-native-parity.sh

      - name: Rename binary
        run: mv target/*-runner target/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}

  # ===========================================
  # Create GitHub Release
  # ===========================================
  release:
    name: Create Release
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      # A single self-contained jar for the release asset; the regular build stays fast-jar
      # (target/quarkus-app/quarkus-run.jar). The uber-jar is target/<artifactId>-<version>-runner.jar.
      - name: Set version and build uber-jar
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          ./mvnw -B package -DskipTests -Dquarkus.package.jar.type=uber-jar
          mv target/cncf-tech-advisor-mcp-${{ steps.version.outputs.version }}-runner.jar target/cncf-tech-advisor-mcp.jar

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp target/cncf-tech-advisor-mcp.jar release/
          cp artifacts/cncf-tech-advisor-mcp-macos-arm64/cncf-tech-advisor-mcp-macos-arm64 release/
          cp artifacts/cncf-tech-advisor-mcp-linux-x64/cncf-tech-advisor-mcp-linux-x64 release/
          chmod +x release/cncf-tech-advisor-mcp-*
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/cncf-tech-advisor-mcp.jar
            release/cncf-tech-advisor-mcp-macos-arm64
            release/cncf-tech-advisor-mcp-linux-x64
          generate_release_notes: true
          body: |
            ## CNCF Tech Advisor MCP Server v${{ steps.version.outputs.version }}

            A Model Context Protocol server that gives a language model read-only access to the
            public [CNCF Landscape](https://landscape.cncf.io). Every value from the landscape is
            sanitized and rendered inside a fenced block marked as untrusted third-party content.

            ### Tools

            | Tool | What it does |
            |---|---|
            | `search_cncf(query?, category?, limit?)` | Keyword and/or exact-category search. |
            | `get_cncf_project(projectName)` | Full detail of one project by its exact name (case-insensitive). |
            | `list_cncf_categories()` | Every category with its project count. |
            | `refresh_cncf_data()` | Check whether the in-memory catalogue is current (`updated` / `unchanged` / `throttled`). |

            ### Run on stdio (Claude Desktop, Claude Code, ...)

            JAR (needs Java 25+):
            ```bash
            java -jar cncf-tech-advisor-mcp.jar
            claude mcp add cncf -- java -jar /path/to/cncf-tech-advisor-mcp.jar
            ```

            Native executable (no Java needed), `cncf-tech-advisor-mcp-linux-x64` or
            `cncf-tech-advisor-mcp-macos-arm64`:
            ```bash
            chmod +x cncf-tech-advisor-mcp-linux-x64
            claude mcp add cncf -- /path/to/cncf-tech-advisor-mcp-linux-x64
            ```
            On macOS, a downloaded binary may need `xattr -d com.apple.quarantine <file>` first.

            ### Run on Streamable HTTP (container)

            The image serves HTTP only, at `http://127.0.0.1:8080/mcp`:
            ```bash
            docker run --rm -p 127.0.0.1:8080:8080 ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```
            The server has no authentication of its own: keep the port on loopback or put a
            network boundary in front of it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # Build and Push Docker Image
  # ===========================================
  docker:
    name: Publish Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # The test job has already run the suite.
          build-args: MAVEN_BUILD_ARGS=-DskipTests
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
