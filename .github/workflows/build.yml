# =============================================================================
# CNCF Tech Advisor MCP Server - CI/CD Pipeline
# =============================================================================
# This workflow builds and deploys the CNCF Tech Advisor MCP server
# with multi-platform support (Linux, macOS, Windows) and both
# JVM and native image builds.

name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: "-Xmx2g"

jobs:
  # =============================================================================
  # Test Job - Run tests on multiple platforms
  # =============================================================================
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The pom sets maven.compiler.release=25, so no older JDK can compile it.
        java-version: [25]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run tests
        run: ./mvnw verify

      - name: Generate test report
        if: (success() || failure()) && matrix.java-version == 25 && matrix.os == 'ubuntu-latest'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # =============================================================================
  # Build Job - Build JAR and Docker images
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.meta.outputs.tags }}
      jar-name: ${{ steps.jar.outputs.filename }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Get version
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build JAR
        run: ./mvnw package -DskipTests

      - name: Get JAR filename
        id: jar
        run: |
          # Quarkus fast-jar layout: the launcher is target/quarkus-app/quarkus-run.jar
          JAR_FILE=target/quarkus-app/quarkus-run.jar
          test -f "$JAR_FILE" || { echo "::error::$JAR_FILE not found"; exit 1; }
          echo "filename=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT
          echo "JAR file: $JAR_FILE"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/labjp-mcp/cncf-tech-advisor-mcp
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: MAVEN_BUILD_ARGS=-DskipTests
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=CNCF Tech Advisor MCP Server
            org.opencontainers.image.description=Intelligent CNCF technology recommendations and analysis
            org.opencontainers.image.vendor=Jean Lopez
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push development image
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: MAVEN_BUILD_ARGS=-DskipTests
          target: jvm-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/labjp-mcp/cncf-tech-advisor-mcp:dev

      - name: Upload JAR artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jar-${{ steps.version.outputs.version }}
          path: target/quarkus-app/

      - name: Upload NPM package files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package-${{ steps.version.outputs.version }}
          path: |
            bin/
            package.json
            README.md
            LICENSE

  # =============================================================================
  # NPM Publish Job - Publish to npm registry
  # =============================================================================
  npm-publish:
    name: NPM Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download NPM package files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.build.outputs.version }}

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # =============================================================================
  # Security Scan Job
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: 'cncf-tech-advisor'
          path: '.'
          format: 'HTML'

      - name: Upload OWASP results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-check-report
          path: reports/

  # =============================================================================
  # Integration Test Job
  # =============================================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    # Pull requests do not publish an image, so there is nothing to pull.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    services:
      cncf-tech-advisor:
        image: ghcr.io/labjp-mcp/cncf-tech-advisor-mcp:sha-${{ github.sha }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
        env:
          QUARKUS_MCP_SERVER_STDIO_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Wait for server to be ready
        run: |
          echo "Waiting for MCP server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8080/q/health >/dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i/30: Server not ready..."
            sleep 2
          done

      # Inline rather than docker/scripts/mcp-test.sh, which is legacy (see CLAUDE.md) and
      # predates Streamable HTTP: no Accept header, batched requests.
      - name: Run MCP integration tests
        run: |
          set -euo pipefail
          URL=http://localhost:8080/mcp
          H=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')

          curl -sS -D headers.txt -X POST "${H[@]}" "$URL" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | tee init.json | grep -q '"serverInfo"' || { echo "::error::initialize failed"; cat init.json; exit 1; }
          SESSION=$(grep -i '^mcp-session-id:' headers.txt | cut -d' ' -f2 | tr -d '\r')
          H+=(-H "Mcp-Session-Id: $SESSION" -H 'MCP-Protocol-Version: 2025-06-18')

          tools=$(curl -sS -X POST "${H[@]}" "$URL" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | grep -o '"name":"[a-z_]*_cncf[a-z_]*"' | sort -u | wc -l)
          [ "$tools" -eq 4 ] || { echo "::error::expected 4 tools, got $tools"; exit 1; }

          curl -sS -X POST "${H[@]}" "$URL" \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_cncf","arguments":{"query":"kubernetes","limit":5}}}' \
            | grep -q '"isError":false' || { echo "::error::search_cncf failed"; exit 1; }

          echo "initialize, tools/list (4 tools) and search_cncf all answered."

  # =============================================================================
  # Native Build Job
  # =============================================================================
  # Not experimental and not allowed to fail quietly any more: a Temurin JDK has no
  # native-image, so the previous version of this job could never have produced a binary,
  # and `continue-on-error` hid that. Mandrel is the GraalVM distribution Quarkus is tested
  # against. The parity check is the part that matters -- see ci.yml for why the catalogue
  # of the native binary has to be compared with the JVM's rather than trusted.
  native-build:
    name: Native Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Mandrel 25
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          distribution: 'mandrel'
          java-version: '25'
          cache: 'maven'

      - name: Build native executable
        run: ./mvnw package -Pnative -DskipTests -B -Dquarkus.native.native-image-xmx=5g

      - name: Compare tools/list between JVM and native
        run: scripts/mcp-native-parity.sh

      - name: Build native container images
        run: |
          docker build -f src/main/docker/Dockerfile.native -t cncf-tech-advisor-mcp:native-ci .
          docker build -f src/main/docker/Dockerfile.native-micro -t cncf-tech-advisor-mcp:native-micro-ci .

      - name: Upload native artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-executable
          path: target/*-runner